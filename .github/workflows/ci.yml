name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm from packageManager
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Bootstrap GAGA Engine 0.1.6
        run: node scripts/bootstrap-gaga.mjs
        env:
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify generated dependency graph
        run: |
          test -f pnpm-lock.yaml
          pnpm list --depth 0 -r
          git diff --exit-code -- pnpm-workspace.yaml

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Static release verification
        run: pnpm verify:static
